<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Conclave</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="lobby">
    <main>
      <h1>Agentic Conclave</h1>
      <section class="panel">
        <h2>New Game</h2>
        <form id="new-game-form">
          <label for="campaign-name">Campaign name</label>
          <input
            id="campaign-name"
            name="campaign_name"
            type="text"
            value="The Forgotten Ruins"
            required
          />
          <label for="seed">Seed (optional)</label>
          <input id="seed" name="seed" type="number" step="1" placeholder="random" />
          <button id="create-game" type="submit">Create Game</button>
        </form>
        <p id="lobby-error" class="error" role="alert" hidden></p>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
